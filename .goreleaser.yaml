# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: devcontainer-patcher

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: dcp
    binary: dcp
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/clamoriniere/devcontainer-patcher/cmd.version={{ .Version }}
      - -X github.com/clamoriniere/devcontainer-patcher/cmd.commit={{ .Commit }}
      - -X github.com/clamoriniere/devcontainer-patcher/cmd.date={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: dcp
    ids:
      - dcp
    name_template: >-
      dcp_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - docs/*

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: clamoriniere
    name: devcontainer-patcher
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"

# Homebrew tap. `brews` is deprecated in GoReleaser (still works in v2.18); the
# release workflow runs with `--skip=validate` so the deprecation notice doesn't
# fail the run. Pushes over SSH with a write deploy key scoped to homebrew-tap
# (secret HOMEBREW_TAP_DEPLOY_KEY on this repo) — no account-wide PAT.
brews:
  - name: dcp
    ids:
      - dcp
    repository:
      owner: clamoriniere
      name: homebrew-tap
      branch: main
      git:
        url: "ssh://git@github.com/clamoriniere/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
        ssh_command: "ssh -i {{ .KeyPath }} -o StrictHostKeyChecking=accept-new -F /dev/null"
    directory: Formula
    homepage: "https://github.com/clamoriniere/devcontainer-patcher"
    description: "Layer personal dev container overrides on top of a repo's devcontainer.json"
    license: "MIT"
    # devcontainer-patcher is a private repo, so anonymous curl on the release
    # asset URL 404s. This strategy makes `brew install` fetch it through the
    # GitHub API using HOMEBREW_GITHUB_API_TOKEN (see brew-auth in dotfiles).
    download_strategy: GitHubPrivateRepositoryReleaseDownloadStrategy
    install: |
      bin.install "dcp"
    test: |
      system "#{bin}/dcp", "version"
    caveats: |
      dcp wraps the `devcontainer` CLI for `up`/`build`/`exec` — install it too:
        npm install -g @devcontainers/cli
